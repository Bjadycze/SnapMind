[versions]
# Verified against the Task 0 spike build: AGP 8.7.3 / Kotlin 2.0.21 / Gradle 8.9 / JDK 21.
# Target API 36 migration: AGP 8.9.3 requires Gradle >= 8.11.1, which is above Kotlin 2.0.21's
# documented range (max Gradle 8.10) -- Kotlin bumped to 2.1.20 (range 7.6.3-8.12.1) to cover it.
agp = "8.9.3"
kotlin = "2.1.20"
ksp = "2.1.20-1.0.32"
# 2.52 failed hiltJavaCompileDebug against Kotlin 2.1.20 metadata ("unsupported metadata
# version"); 2.60.1 synced past that but requires AGP 9 (Hilt release notes: AGP 9 became
# mandatory for the Hilt Gradle plugin starting at 2.59, github.com/google/dagger releases).
# 2.58 is the newest version below that line: its own release notes say AGP 9 support was
# deliberately held back from 2.58 "because it forces users onto AGP 9", and its published POM
# (dagger-compiler-2.58.pom) declares org.jetbrains.kotlin:kotlin-metadata-jvm 2.2.20 as a real
# dependency -- newer than the 2.1.10 shaded into 2.56.2 -- so it reads Kotlin 2.1.20 metadata.
hilt = "2.58"
hiltNavigation = "1.2.0"
# Room 2.6.1 crashes under KSP2 ("unexpected jvm signature V"). KSP2 support landed in 2.7.
room = "2.7.2"
workManager = "2.9.1"
hiltWork = "1.2.0"
mlkitText = "16.0.1"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
coil = "2.7.0"
datastore = "1.1.1"
coroutines = "1.9.0"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
billing = "7.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigation" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
hilt-work-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }

mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitText" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }
