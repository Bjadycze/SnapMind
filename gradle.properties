org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# KSP2. KSP 2.1.20-1.0.32 still defaults to KSP1 (the "1.0.x" half of the version),
# and KSP1 throws NullPointerException in KSDeclarationImpl.simpleName while Dagger 2.58
# validates @Module objects under Kotlin 2.1.20. Dagger 2.57+ targets KSP2.
ksp.useKSP2=true
